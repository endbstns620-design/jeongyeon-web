<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정연지오빌1 관리비 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 장부형 업무 화면: 남색 상단 띠 + 탭 + 노란 입력칸 표. 숫자는 오른쪽 정렬 고정폭 */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--surface2:#f6f8fb;--line:#dbe1e9;--fg:#1c2632;--muted:#667383;
  --navy:#17365d;--navy2:#21477a;--navyfg:#ffffff;--input:#fff8dc;--inputline:#e6d690;--focus:#3b78c4;
  --red:#b42424;--redbg:#fbeaea;--amber:#8a5a00;--amberbg:#fff4d6;--green:#1b7a3d;--greenbg:#e6f5ec;--blue:#1d4f91;--bluebg:#e8f0fb;--bar:#3b78c4;
  --font:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d;--surface:#18202a;--surface2:#1e2833;--line:#2c3846;--fg:#e4e9ef;--muted:#93a0af;
  --navy:#0f2540;--navy2:#1b3a62;--navyfg:#ffffff;--input:#2c2914;--inputline:#5b5223;--focus:#6fa5e8;
  --red:#ff8a80;--redbg:#3a1d1d;--amber:#f2c35b;--amberbg:#382c12;--green:#7fd39c;--greenbg:#173326;--blue:#9cc3f5;--bluebg:#1a2b42;--bar:#6fa5e8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d;--surface:#18202a;--surface2:#1e2833;--line:#2c3846;--fg:#e4e9ef;--muted:#93a0af;
  --navy:#0f2540;--navy2:#1b3a62;--navyfg:#ffffff;--input:#2c2914;--inputline:#5b5223;--focus:#6fa5e8;
  --red:#ff8a80;--redbg:#3a1d1d;--amber:#f2c35b;--amberbg:#382c12;--green:#7fd39c;--greenbg:#173326;--blue:#9cc3f5;--bluebg:#1a2b42;--bar:#6fa5e8;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
header{background:var(--navy);color:var(--navyfg);display:flex;align-items:center;gap:8px 10px;padding:10px 16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0 10px 0 0;text-wrap:balance}
header select,header button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:var(--navy2);color:var(--navyfg);cursor:pointer}
header .sp{flex:1}
.sync{font-size:12px;opacity:.85}
nav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--fg);font-weight:700;border-bottom-color:var(--focus)}
nav .badge{display:inline-block;background:var(--red);color:var(--surface);border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
main{max-width:1240px;margin:0 auto;padding-block:16px;padding-inline:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .k{font-size:12px;color:var(--muted);letter-spacing:.02em}.card .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;min-width:0}
.panel h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.msg{padding:9px 12px;border-radius:6px;margin:6px 0;display:flex;gap:12px}
.msg b{min-width:34px;flex:none}
.err{background:var(--redbg);color:var(--red)}.warn{background:var(--amberbg);color:var(--amber)}.ok{background:var(--greenbg);color:var(--green)}.info{background:var(--bluebg);color:var(--blue)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:var(--surface2);font-weight:600;font-size:13px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:var(--surface2);font-weight:600}
tr.tot td{background:var(--surface2);font-weight:700}
.wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px}
input.c{font:inherit;color:var(--fg);width:100%;min-width:70px;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:var(--input);font-variant-numeric:tabular-nums}
input.c:hover{border-color:var(--inputline)}input.c:focus{outline:2px solid var(--focus);background:var(--surface)}
input.c.num{text-align:right}
input.c[readonly]{background:transparent;border-color:transparent;outline:none}
.btn{font:inherit;color:var(--fg);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn:focus-visible,nav button:focus-visible,header button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.p{background:var(--navy);border-color:var(--navy);color:var(--navyfg)}
.btn.d{color:var(--red)}
.btn.s{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.muted{color:var(--muted)}.red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.lock{background:var(--amberbg);color:var(--amber);padding:8px 12px;border-radius:6px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.calc td{padding:8px}.calc td:first-child{color:var(--muted)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20;max-width:90vw}
textarea{font:inherit;color:var(--fg);background:var(--surface);width:100%;min-height:70px;padding:8px;border:1px solid var(--line);border-radius:6px}
select.c{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--inputline);border-radius:4px;padding:3px 4px}
#quick{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:25;padding:0}
#quick .qbox{background:var(--surface);color:var(--fg);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
#quick .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
#quick .qroom{font-size:22px}#quick .qroom b{font-size:30px;margin-right:8px}
#quick label{min-width:0;display:grid;gap:4px;font-size:14px;color:var(--muted)}
#quick input{width:100%;min-width:0;font:inherit;font-size:26px;padding:10px 12px;border:2px solid var(--inputline);border-radius:8px;background:var(--input);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
#quick .row{display:grid;grid-template-columns:1fr 2fr;gap:8px}#quick .row .btn{padding:12px;font-size:16px}
.closed{background:var(--greenbg);color:var(--green);padding:8px 12px;border-radius:6px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.log{border-bottom:1px solid var(--line);padding:8px 0}.log .h{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}.log ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.neg{color:var(--blue)}
header .s{display:none}
@media(max-width:600px){
 header{position:static;padding:8px 12px;gap:6px}
 header h1{font-size:14px;margin:0;flex:1}
 header .sp,#who,#logout,header .l{display:none}
 header .s{display:inline}
 header label{flex:1 1 100%;display:flex;align-items:center;gap:6px;font-size:13px;order:3}
 header label select{flex:1}
 #newMonth,#exportX,#undo{order:4;flex:1;padding:6px 4px;font-size:13px}
 .sync{order:2;font-size:11px}
 nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:0 4px}
 nav button{padding:10px 9px;font-size:13px}
 main{padding-inline:10px}
 .wrap{max-height:none}
th,td{padding:5px 6px}input.c{min-width:60px}.hide-m{display:none}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal .box{background:var(--surface);color:var(--fg);border-radius:10px;padding:20px;max-width:440px;width:100%;white-space:pre-line}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#login{max-width:380px;margin:12vh auto 0;padding-inline:16px}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:10px}
#login h1{font-size:19px;margin:0 0 6px}
#login label{font-size:13px;color:var(--muted);display:grid;gap:4px}
#login input{font:inherit;color:var(--fg);background:var(--surface2);padding:9px 10px;border:1px solid var(--line);border-radius:6px}
#login .links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#loginMsg{min-height:1.4em;color:var(--red);font-size:13px}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline}
#who{font-size:12px;opacity:.85}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>정연지오빌1 관리비 정산</h1>
    <p class="muted" style="margin:0 0 6px;font-size:13px">허용된 계정만 볼 수 있습니다.</p>
    <label>이메일<input id="email" type="email" autocomplete="username" required></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn p" id="loginBtn" type="submit">로그인</button>
    <div class="links"><span class="muted" style="font-size:12px">계정은 관리자만 만들 수 있습니다</span><button class="linkbtn" id="resetBtn" type="button">비밀번호를 잊었어요</button></div>
    <div id="loginMsg" role="status"></div>
  </form>
</div>
<div id="app" hidden>
<header>
  <h1>정연지오빌1 관리비 정산</h1>
  <label>정산월 <select id="period"></select></label>
  <button id="newMonth"><span class="l">+ 새 달 만들기</span><span class="s">+ 새 달</span></button>
  <button id="exportX"><span class="l">엑셀로 내보내기</span><span class="s">엑셀</span></button>
  <span class="sp"></span>
  <span class="sync" id="sync">연결 중…</span>
  <span id="who"></span>
  <button id="logout">로그아웃</button>
  <button id="undo" title="이번 접속에서 마지막으로 바꾼 내용을 되돌립니다" aria-label="되돌리기">↶<span class="l"> 되돌리기</span></button>
</header>
<nav id="tabs"></nav>
<main id="main"><div class="empty">관리비 자료를 불러오는 중입니다…</div></main>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="box"><div id="modalMsg"></div><div class="row"><button class="btn" id="modalNo">취소</button><button class="btn p" id="modalYes">확인</button></div></div></div>
<input type="file" id="restoreFile" accept=".json" hidden>
<div id="quick" hidden><div class="qbox">
  <div class="qtop"><span id="qPos"></span><button class="btn s" id="qClose">닫기</button></div>
  <div class="qroom"><b id="qRoom"></b> <span id="qName"></span></div>
  <label>당월 전기 <small id="qEp"></small><input id="qEc" inputmode="numeric" autocomplete="off"></label>
  <label id="qWl">당월 수도 <small id="qWp"></small><input id="qWc" inputmode="numeric" autocomplete="off"></label>
  <div id="qUse" class="muted"></div>
  <div class="row"><button class="btn" id="qPrev">◀ 이전</button><button class="btn p" id="qNext">저장 후 다음 ▶</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=4"></script>
<script>
'use strict';
const ROOMS_FLOORS=[2,3,4,5,6];
let S={periods:{}}, META={}, cur=null, tab='summary', unlocked={}, histRoom='201', FS=null, ready=false, canWrite=true, unsub=null, USER=null, APPMETA={};
const undoStack=[], baseRev={}, dirtyBase={};
const $=s=>document.querySelector(s);
const fmt=v=>v===null||v===undefined||v===''||isNaN(v)?'':Math.round(v).toLocaleString('ko-KR');
const won=v=>v===null||v===undefined?'—':fmt(v)+'원';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toNum=s=>{if(s===null||s===undefined)return null;s=String(s).replace(/[,\s원]/g,'');if(s==='')return null;const n=Number(s);return isNaN(n)?NaN:n};
const label=p=>{const[y,m]=p.split('.');return `${y}년 ${+m}월분`};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const nowStr=ms=>new Date(ms).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function ask(msg,yes='확인',onlyOk=false){return new Promise(res=>{$('#modalMsg').textContent=msg;$('#modalYes').textContent=yes;$('#modalNo').hidden=onlyOk;$('#modal').hidden=false;
  const done=v=>{$('#modal').hidden=true;$('#modalYes').onclick=$('#modalNo').onclick=null;res(v)};$('#modalYes').onclick=()=>done(true);$('#modalNo').onclick=()=>done(false);$('#modalYes').focus()})}
const tell=msg=>ask(msg,'확인',true);
function setSync(t){$('#sync').textContent=t}
const META_KEYS=['rev','updatedAt','updatedBy','updatedAtMs'];
function blank(p){p=p||{};const o=Object.assign({meters:[],payments:[],expenses:[],cash:[],arrears:[],opening:null,memo:'',billing:null,closed:null},p);META_KEYS.forEach(k=>delete o[k]);return o}

/* ---------- 날짜 정리: 8/26, 0826, 08월26일, 2026-08-26 → 08월26일 ---------- */
function normDate(s){
  s=String(s||'').trim();if(!s)return '';
  let m=s.match(/^(?:\d{4}[-./])?(\d{1,2})[-./월\s]+(\d{1,2})일?$/)||s.match(/^(\d{2})(\d{2})$/);
  if(m){const mm=+m[1],dd=+m[2];if(mm>=1&&mm<=12&&dd>=1&&dd<=31)return `${String(mm).padStart(2,'0')}월${String(dd).padStart(2,'0')}일`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);if(m)return `${m[2]}월${m[3]}일`;
  return s;
}
const dateKey=s=>{const m=String(s||'').match(/(\d{1,2})\D+(\d{1,2})/);return m?(+m[1])*100+(+m[2]):9999};

/* ---------- 변경 내용 요약 ---------- */
const LISTN={payments:'입금',expenses:'통장 지출',cash:'시재 지출',arrears:'미납'};
const FIELDN={room:'호실',payer:'입금자',date:'날짜',amount:'금액',note:'비고',desc:'내용',name:'이름',charge:'부과액',lateFee:'연체료',ep:'전월 전기',ec:'당월 전기',wp:'이전 수도',wc:'당월 수도',bank:'통장 이월금',interest:'이자',cash:'시재 이월금',total:'총액',method:'배분방식',exclude:'제외 호실'};
const sv=v=>v===null||v===undefined||v===''?'(빈칸)':typeof v==='number'?fmt(v):String(v);
function rowLabel(l,o){return (o.room?`${o.room}호`:(o.desc||o.name||''))+(o.charge!==undefined&&o.amount===undefined?` ${fmt(o.charge)}원`:'')}
function diffPeriod(a,b){
  a=a||{};b=b||{};const out=[];
  if(!a.meters&&b.meters){out.push('새 달 생성');return out}
  if(a.meters&&!b.meters){out.push('달 삭제');return out}
  const am=Object.fromEntries((a.meters||[]).map(r=>[r.room,r]));
  for(const r of b.meters||[]){const o=am[r.room]||{};for(const f of ['name','ep','ec','wp','wc'])if((o[f]??null)!==(r[f]??null))out.push(`검침 ${r.room}호 ${FIELDN[f]}: ${sv(o[f])} → ${sv(r[f])}`)}
  for(const l of Object.keys(LISTN)){
    const A=a[l]||[],B=b[l]||[];
    if(A.length===B.length){B.forEach((r,i)=>{const o=A[i]||{};for(const f of Object.keys(r))if(JSON.stringify(o[f])!==JSON.stringify(r[f]))out.push(`${LISTN[l]} ${i+1}번째 줄(${rowLabel(l,r)}) ${FIELDN[f]||f}: ${sv(o[f])} → ${sv(r[f])}`)})}
    else{const ka=A.map(x=>JSON.stringify(x)),kb=B.map(x=>JSON.stringify(x));
      B.forEach((r,i)=>{if(!ka.includes(kb[i]))out.push(`${LISTN[l]} 추가/수정: ${rowLabel(l,r)} ${r.amount!==undefined?fmt(r.amount)+'원':''}`)});
      A.forEach((r,i)=>{if(!kb.includes(ka[i]))out.push(`${LISTN[l]} 삭제: ${rowLabel(l,r)} ${r.amount!==undefined?fmt(r.amount)+'원':''}`)})}
  }
  if(JSON.stringify(a.opening)!==JSON.stringify(b.opening)){const o=a.opening||{},n=b.opening||{};for(const f of ['bank','interest','cash'])if((o[f]??null)!==(n[f]??null))out.push(`이월금 ${FIELDN[f]}: ${sv(o[f])} → ${sv(n[f])}`)}
  if(JSON.stringify(a.billing)!==JSON.stringify(b.billing)){
    const A=(a.billing||{}).items||[],B=(b.billing||{}).items||[];
    if(A.length!==B.length)out.push(`부과 항목 ${A.length}개 → ${B.length}개`);
    B.forEach((r,i)=>{const o=A[i]||{};for(const f of ['name','total','method','exclude'])if(JSON.stringify(o[f])!==JSON.stringify(r[f]))out.push(`부과 항목 ${i+1}(${r.name||''}) ${FIELDN[f]||f}: ${sv(o[f])} → ${sv(r[f])}`)});
    const aa=(a.billing||{}).adjust||{},ba=(b.billing||{}).adjust||{};
    new Set([...Object.keys(aa),...Object.keys(ba)]).forEach(k=>{if((aa[k]??null)!==(ba[k]??null))out.push(`부과 개별 조정 ${k}호: ${sv(aa[k])} → ${sv(ba[k])}`)});
    if(((a.billing||{}).unit)!==((b.billing||{}).unit))out.push('부과 반올림 단위 변경');
  }
  if(JSON.stringify(a.closed)!==JSON.stringify(b.closed))out.push(b.closed?'월 마감':'월 마감 해제');
  if((a.memo||'')!==(b.memo||''))out.push('메모 수정');
  return out;
}

/* ---------- 저장 (Firestore, 충돌 감지) ---------- */
const pending={}, writing={}, timers={};
const anyPending=()=>Object.values(pending).some(Boolean)||Object.values(writing).some(Boolean);
function markDirty(p,before,opt){
  undoStack.push({p,doc:before});if(undoStack.length>30)undoStack.shift();
  if(!(p in dirtyBase))dirtyBase[p]=before===null?null:clone(before);
  pending[p]=opt||true;setSync('저장 중…');clearTimeout(timers[p]);timers[p]=setTimeout(()=>flush(p),400);
}
async function flush(p){
  if(!FS)return;
  if(writing[p]){timers[p]=setTimeout(()=>flush(p),300);return}
  const opt=typeof pending[p]==='object'?pending[p]:{};
  writing[p]=true;pending[p]=false;

/* 부과 */
const METHODS={equal:'세대 균등',elec:'전기 사용량 비례',water:'수도 사용량 비례'};
function hasBilling(p){const b=P(p).billing;return !!(b&&((b.items||[]).length||Object.values(b.adjust||{}).some(v=>v)))}

  const x=P(p),b=x.billing;if(!hasBilling(p))return _memo[k]=null;
  const unit=b.unit||10,rooms=roomsOf(p),rows=meterRows(p),eMap=Object.fromEntries(rows.map(r=>[r.room,Math.max(0,r.e.u||0)])),wu=waterUse(p);

/* 미납: 부과가 있는 달은 호실별 장부(이월+부과-입금), 없는 달은 미납 목록(납부액은 입금 탭에서 자동) */

function endBalance(q,room){

function checks(p){

  S.periods[np]=blank({meters:L.meters.map(r=>({room:r.room,name:r.name,ep:r.ec,ec:null,wp:odd?(lastW[r.room]??null):null,wc:null})),arrears,

  if(e.target.id==='logOnlyCur'){VIEWS._logCur=e.target.checked;loadLogs()}
  if(e.target.id==='memo'){const v=e.target.value;change(cur,x=>x.memo=v);toast('메모를 저장했습니다')}
  if(e.target.id==='restoreFile'){const f=e.target.files[0];e.target.value='';if(f)restore(f)}
});
$('#newMonth').onclick=newMonth;
$('#exportX').onclick=exportMonth;
$('#undo').onclick=async()=>{
  const u=undoStack.pop();if(!u)return toast('이번 접속에서 되돌릴 변경이 없습니다');
  const before=S.periods[u.p]?clone(S.periods[u.p]):null;
  if(u.doc)S.periods[u.p]=u.doc; else delete S.periods[u.p];
  if(!(u.p in dirtyBase))dirtyBase[u.p]=before;pending[u.p]={reason:'되돌리기'};clearTimeout(timers[u.p]);timers[u.p]=setTimeout(()=>flush(u.p),50);render();toast(`${label(u.p)} 변경을 되돌렸습니다`);
};
async function saveFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=filename;document.body.appendChild(el);el.click();setTimeout(()=>{el.remove();URL.revokeObjectURL(u)},3000);return true}
  catch(e){tell('파일을 내려받지 못했습니다: '+e.message);return false}
}
async function backup(){
  if(await saveFile(`정연관리비_백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:3,periods:S.periods,exportedAt:new Date().toISOString()}))){await saveMeta({lastBackup:Date.now()});render();toast('백업 파일을 내려받았습니다 (다운로드 폴더)')}
}
async function restore(f){
  let d;try{d=JSON.parse(await f.text());if(!d.periods||typeof d.periods!=='object')throw 0}catch(_){return tell('올바른 백업 파일이 아닙니다.')}
  const ids=Object.keys(d.periods).filter(k=>/^\d{4}\.\d{2}$/.test(k));
  if(!ids.length)return tell('백업 파일에 정산월 자료가 없습니다.');
  if(!await ask(`백업 파일의 ${ids.length}개월 자료로 현재 자료를 바꿀까요?\n(백업에 없는 달은 그대로 둡니다. 바뀌기 전 상태는 변경 기록에 보관됩니다)`,'복원'))return;
  for(const id of ids){const before=S.periods[id]?clone(S.periods[id]):null;S.periods[id]=blank(d.periods[id]);if(!(id in dirtyBase))dirtyBase[id]=before;pending[id]={force:true,reason:'백업 파일에서 복원'};await flush(id)}
  render();toast('복원했습니다');
}
/* ---------- 엑셀 (원본 양식에 가깝게) ---------- */
function needX(){if(typeof XLSX==='undefined'){tell('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.');return false}return true}
function ws(rows,widths,merges){const s=XLSX.utils.aoa_to_sheet(rows);s['!cols']=widths.map(w=>({wch:w}));if(merges)s['!merges']=merges;return s}
const M=(r1,c1,r2,c2)=>({s:{r:r1,c:c1},e:{r:r2,c:c2}});
function exportMonth(){
  if(!cur||!needX())return;
  const x=P(),wb=XLSX.utils.book_new(),y=cur.slice(0,4),m=+cur.slice(5),pm=m===1?12:m-1,mr=meterRows(cur);
  // 검침 (원본: 분류/전기/수도, 층별 소계, 합계)
  const s1=[['정연지오빌1차   전기,수도 검침량'],[`${y}년 ${m}월분`],['분류','','전기','','','수도'],['호수','성명',`${pm}월분`,`${m}월분`,'사용량','이전','당월','사용량']];
  for(const f of ROOMS_FLOORS){const fr=mr.filter(r=>r.room[0]==String(f));fr.forEach(r=>s1.push([+r.room,r.name,r.ep,r.ec,r.e.u,r.wp,r.wc,r.w.u]));s1.push(['소계','',sum(fr.map(r=>r.ep)),sum(fr.map(r=>r.ec)),sum(fr.map(r=>r.e.u)),sum(fr.map(r=>r.wp)),sum(fr.map(r=>r.wc)),sum(fr.map(r=>r.w.u))])}
  s1.push(['합계','',sum(mr.map(r=>r.ep)),sum(mr.map(r=>r.ec)),sum(mr.map(r=>r.e.u)),sum(mr.map(r=>r.wp)),sum(mr.map(r=>r.wc)),sum(mr.map(r=>r.w.u))]);
  XLSX.utils.book_append_sheet(wb,ws(s1,[8,12,10,10,10,10,10,10],[M(0,0,0,7),M(2,2,2,4),M(2,5,2,7)]),`${y}.${String(m).padStart(2,'0')}`);
  if(hasBilling(cur)){const B=billing(cur),its=x.billing.items;
    const s=[[`[정연지오빌1 ${m}월분 관리비 부과내역]`],[],['호실','성명',...its.map(i=>i.name),'개별 조정','부과액'],...roomsOf(cur).map(r=>[+r,(x.meters.find(z=>z.room===r)||{}).name,...B.per[r].items,B.per[r].adjust,B.per[r].total]),['합계','',...B.itemRes.map(i=>i.alloc),sum(Object.values(x.billing.adjust||{})),B.sum],[],['항목','고지서 총액','나누는 방식','제외 호실'],...its.map(i=>[i.name,i.total,METHODS[i.method],i.exclude||''])];
    XLSX.utils.book_append_sheet(wb,ws(s,[8,12,...its.map(()=>12),10,12]),'부과내역')}
  if(finActive(cur)){
    const pays=x.payments.slice().sort((a,b)=>(+a.room||0)-(+b.room||0));
    XLSX.utils.book_append_sheet(wb,ws([[`<정연 지오빌1 ${y}년${m}월분 관리비 입금 내역서>`],['호    실','성    명','입 금 일','입 금 액','비    고'],...pays.map(a=>[a.room,a.payer,a.date,a.amount,a.note]),['','','합    계',sum(x.payments.map(a=>a.amount)),'']],[8,12,12,12,24],[M(0,0,0,4)]),'관리비 입금내역');
    const o=opening(cur),c=closing(cur),mm=String(m).padStart(2,'0'),pmm=String(pm).padStart(2,'0');
    const s3=[[`【 ${y}년도 (${mm}월 달 )  공과금 지출 내역서 】`],['일    자','','지  출  내  용','지  출  금  액','비    고'],...x.expenses.map(a=>[a.date,'',a.desc,a.amount,a.note]),['지 출 총 액','','',c.exp,''],[],['【 전도금 (시재) 지출 내역 】'],['일    자','','지  출  내  용','지  출  금  액','비    고'],[`${pmm} 월달 이월금`,'','',o.cash,''],...x.cash.map(a=>[a.date,'',a.desc,a.amount,a.note]),['지출금액','',c.cashUsed,'지출잔액',c.cash],[],[`【 ${mm}월달 수입 및 지출금 총액 】`],[`   ${pmm} 월달 통장 이월금`,'','',o.bank,''],[`   ${mm}월달 결산 이자`,'','',o.interest||0,''],[`   ${mm} 월 관리비 입금액`,'','',c.pay,''],[`   ${mm} 월 통장 지출금`,'','',c.exp,''],[`   ${mm} 월 시재금 사용 잔액`,'','',c.cash,''],[`   ${mm} 월 통장 잔여금`,'','',c.bank,''],[`${mm}월달 총 합계금 잔액`,'','',c.total,'']];
    XLSX.utils.book_append_sheet(wb,ws(s3,[16,2,24,14,30],[M(0,0,0,4)]),'지출내역');
    let s4;
    if(hasBilling(cur)){const L=ledger(cur);s4=[[`[정연지오빌1 ${mm}월분 관리비 미납현황]`],['호수','입주자 이름','전월 잔액','당월 부과액','당월 입금','미납(과오납) 잔액'],...roomsOf(cur).filter(r=>L.rows[r].end!==0).map(r=>[+r,(x.meters.find(z=>z.room===r)||{}).name,L.rows[r].carry,L.rows[r].bill,L.rows[r].paid,L.rows[r].end]),['합 계','','','','',unpaidTotal(cur)]]}
    else s4=[[`[정연지오빌1 ${mm}월분 관리비 미납현황]`],['호수','입주자 이름','당월 부과액','연체료','이번 달 입금','납기후 금액','비       고'],...x.arrears.map(a=>[+a.room||a.room,a.name,a.charge,a.lateFee,arrearPaid(cur,a),arrearLeft(a,cur),a.note]),['합 계','','','','',unpaidTotal(cur),'']];
    XLSX.utils.book_append_sheet(wb,ws(s4,[8,12,12,12,12,14,24],[M(0,0,0,5)]),'미납현황');
  }
  XLSX.writeFile(wb,`정연지오빌1_관리비_${cur}.xlsx`);toast('엑셀 파일을 내려받았습니다 (다운로드 폴더)');
}
function exportAll(){
  if(!needX())return;
  const ps=periods(),wb=XLSX.utils.book_new(),rooms=P(ps[ps.length-1]).meters.map(r=>r.room),head=['정산월',...rooms.map(r=>r+'호')];
  const E=[head,...ps.map(p=>{const m=meterRows(p);return [label(p),...rooms.map(r=>{const z=m.find(q=>q.room===r);return z?z.e.u:null})]})];
  const Wt=[head,...ps.map(p=>{const m=meterRows(p);if(!m.some(z=>z.w.u!==null))return null;return [label(p),...rooms.map(r=>{const z=m.find(q=>q.room===r);return z?z.w.u:null})]}).filter(Boolean)];
  XLSX.utils.book_append_sheet(wb,ws(E,[14]),'전기 사용량');XLSX.utils.book_append_sheet(wb,ws(Wt,[14]),'수도 사용량');
  XLSX.writeFile(wb,`정연지오빌1_검침이력_${ps[0]}-${ps[ps.length-1]}.xlsx`);toast('엑셀 파일을 내려받았습니다');
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정연지오빌1 관리비 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 어르신용 장부: 큰 글씨, 큰 버튼, 한 화면에 한 가지 일 */
:root{
  --bg:#f2f4f7;--surface:#ffffff;--surface2:#f5f7fa;--line:#cfd7e1;--fg:#141c26;--muted:#4f5b69;
  --navy:#17365d;--navy2:#24497a;--navyfg:#ffffff;--input:#fff6d6;--inputline:#d9c26a;--focus:#1f6fd1;
  --red:#b3261e;--redbg:#fdeceb;--amber:#7a4f00;--amberbg:#fff1cc;--green:#16703a;--greenbg:#e3f4ea;--blue:#174a8b;--bluebg:#e6effb;--bar:#2f6fbf;
  --font:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c;--surface:#19212b;--surface2:#202a36;--line:#34404e;--fg:#eef2f6;--muted:#aab5c2;
  --navy:#10284a;--navy2:#1c3c66;--navyfg:#ffffff;--input:#2e2a14;--inputline:#6a5d26;--focus:#7fb2ef;
  --red:#ff9a90;--redbg:#3b1f1f;--amber:#f5c860;--amberbg:#3a2e12;--green:#86dba5;--greenbg:#173527;--blue:#a6c9f7;--bluebg:#1b2d45;--bar:#7fb2ef;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c;--surface:#19212b;--surface2:#202a36;--line:#34404e;--fg:#eef2f6;--muted:#aab5c2;
  --navy:#10284a;--navy2:#1c3c66;--navyfg:#ffffff;--input:#2e2a14;--inputline:#6a5d26;--focus:#7fb2ef;
  --red:#ff9a90;--redbg:#3b1f1f;--amber:#f5c860;--amberbg:#3a2e12;--green:#86dba5;--greenbg:#173527;--blue:#a6c9f7;--bluebg:#1b2d45;--bar:#7fb2ef;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:18px}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.55}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:var(--navyfg);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:1.15rem;margin:0;flex:1;min-width:0}
.top .sync{font-size:.8rem;opacity:.9}
.monthbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.monthbar .m{flex:1;text-align:center;font-size:1.25rem;font-weight:700}
.monthbar .m small{display:block;font-size:.75rem;font-weight:400;color:var(--muted)}
.arrow{min-width:52px;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:1.3rem;cursor:pointer}
.arrow[disabled]{opacity:.3}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
main.wide{max-width:1100px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;cursor:pointer;margin-bottom:12px}
h2.title{font-size:1.4rem;margin:4px 0 4px}
p.lead{color:var(--muted);margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}
.panel h3{font-size:1.15rem;margin:0 0 10px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:480px){.money .v{font-size:min(1.15rem,4.8vw)}.money .c{padding:12px}.money .c.big .v{font-size:1.8rem}.todo .t span{font-size:.85rem}}
.money .c{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.money .k{font-size:.9rem;color:var(--muted)}
.money .v{white-space:nowrap;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.money .c.wide{grid-column:1/-1}
.money .c.big{grid-column:1/-1;background:var(--navy);color:var(--navyfg);border-color:var(--navy)}
.money .c.big .k{color:var(--navyfg);opacity:.85}.money .c.big .v{font-size:2rem}
.todo{display:grid;gap:12px;margin-bottom:16px}
.todo button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:84px}
.todo button:hover,.todo button:focus-visible{border-color:var(--focus);outline:none}
.todo .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--navyfg);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700}
.todo .t{flex:1;min-width:0}.todo .t b{display:block;font-size:1.2rem}.todo .t span{color:var(--muted);font-size:.95rem}
.todo .st{flex:none;font-size:.9rem;font-weight:700;padding:6px 10px;border-radius:999px}
.st.done{background:var(--greenbg);color:var(--green)}.st.todo2{background:var(--amberbg);color:var(--amber)}.st.lock{background:var(--bluebg);color:var(--blue)}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.more button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;cursor:pointer;padding:8px}
.alert{padding:12px 14px;border-radius:10px;margin:8px 0;display:flex;gap:10px;font-size:1rem}
.alert b{flex:none}
.err{background:var(--redbg);color:var(--red)}.warn{background:var(--amberbg);color:var(--amber)}.ok{background:var(--greenbg);color:var(--green)}.info{background:var(--bluebg);color:var(--blue)}
.btn{min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;cursor:pointer}
.btn.p{background:var(--navy);border-color:var(--navy);color:var(--navyfg);font-weight:700}
.btn.d{color:var(--red);border-color:var(--red)}
.btn.s{min-height:40px;padding:0 12px;font-size:.9rem}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.back:focus-visible,.arrow:focus-visible,.more button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:64px;font-size:1rem}
.item:hover{border-color:var(--focus)}
.item .r{flex:none;min-width:60px;font-size:1.25rem;font-weight:700}
.item .mid{flex:1;min-width:0}.item .mid small{display:block;color:var(--muted);font-size:.85rem}
.item .amt{flex:none;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item.empty .amt{color:var(--muted);font-weight:400;font-size:1rem}
.item.static{cursor:default}
.floor{font-size:.95rem;color:var(--muted);margin:14px 2px 2px;font-weight:700}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-top:2px solid var(--line);margin-top:10px;font-size:1.1rem;font-weight:700}
.calc{width:100%;border-collapse:collapse;font-size:1.05rem}
.calc td{padding:12px 4px;border-bottom:1px solid var(--line)}.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.calc tr.tot td{font-size:1.25rem;border-bottom:2px solid var(--fg)}
.calc .op{color:var(--muted);width:1.5em}
.red{color:var(--red)}.green{color:var(--green)}.muted{color:var(--muted)}.neg{color:var(--blue)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;background:var(--bluebg);color:var(--blue)}
/* 넓은 표(나누기·지난 기록·변경 기록) */
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
table.t th{background:var(--surface2);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:700;background:var(--surface2)}
input.c{width:100%;min-width:80px;padding:8px 10px;border:1px solid var(--inputline);border-radius:8px;background:var(--input);color:var(--fg);font-size:1rem}
input.c.num{text-align:right}input.c[readonly]{background:transparent;border-color:transparent}
select.c{padding:8px;border:1px solid var(--inputline);border-radius:8px;background:var(--input);color:var(--fg);font-size:1rem}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:1rem}
.log{border-bottom:1px solid var(--line);padding:10px 0}.log ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
/* 큰 입력창 (아래에서 올라옴) */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
#sheet .box{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media(min-width:700px){#sheet{align-items:center}#sheet .box{border-radius:18px}}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
#sheet .hd b{font-size:1.35rem}
#sheet label{display:grid;gap:6px;font-size:1rem;color:var(--muted);min-width:0}
#sheet label small{font-size:.85rem}
#sheet input,#sheet select{width:100%;min-width:0;font-size:1.5rem;padding:12px 14px;border:2px solid var(--inputline);border-radius:10px;background:var(--input);color:var(--fg)}
#sheet input.num{text-align:right;font-variant-numeric:tabular-nums}
#sheet .chips{display:flex;flex-wrap:wrap;gap:6px}
#sheet .chips button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:.95rem;cursor:pointer}
#sheet .hint{font-size:1.05rem;color:var(--fg);background:var(--surface2);border-radius:10px;padding:10px 12px}
#sheet .row{display:flex;gap:10px}#sheet .row .btn{flex:1;min-height:58px;font-size:1.1rem}
#sheet .row .btn.p{flex:2}
/* 확인창 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal .box{background:var(--surface);color:var(--fg);border-radius:16px;padding:22px;max-width:460px;width:100%;white-space:pre-line;font-size:1.1rem}
#modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}#modal .row .btn{flex:1}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:14px 22px;border-radius:12px;z-index:50;max-width:92vw;font-size:1.05rem;text-align:center}
.empty{text-align:center;padding:60px 16px;color:var(--muted);font-size:1.1rem}
/* 로그인 */
#login{max-width:420px;margin:10vh auto 0;padding:0 16px}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:14px}
#login h1{font-size:1.4rem;margin:0}
#login label{display:grid;gap:6px;color:var(--muted)}
#login input{font-size:1.2rem;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg)}
#loginMsg{min-height:1.4em;color:var(--red)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font-size:1rem;padding:6px 0;text-decoration:underline;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>정연지오빌1 관리비 장부</h1>
    <p class="muted" style="margin:0">허락된 사람만 볼 수 있습니다.</p>
    <label>이메일<input id="email" type="email" autocomplete="username" required></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn p full" id="loginBtn" type="submit">들어가기</button>
    <button class="linkbtn" id="resetBtn" type="button">비밀번호를 잊었어요</button>
    <div id="loginMsg" role="status"></div>
  </form>
</div>
<div id="app" hidden>
  <div class="top"><h1>정연지오빌1 관리비 장부</h1><span class="sync" id="sync">연결 중…</span><span id="who" hidden></span><button id="logout" hidden></button></div>
  <div class="monthbar"><button class="arrow" id="mPrev" aria-label="이전 달">◀</button><div class="m" id="mLabel"></div><button class="arrow" id="mNext" aria-label="다음 달">▶</button></div>
  <main id="main"><div class="empty">장부를 불러오는 중입니다…</div></main>
</div>
<div id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<div id="modal" hidden><div class="box"><div id="modalMsg"></div><div class="row"><button class="btn" id="modalNo">취소</button><button class="btn p" id="modalYes">확인</button></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="restoreFile" accept=".json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=4"></script>
<script>
'use strict';
const ROOMS_FLOORS=[2,3,4,5,6];
let S={periods:{}}, META={}, cur=null, tab='summary', unlocked={}, histRoom='201', FS=null, ready=false, canWrite=true, unsub=null, USER=null, APPMETA={};
const undoStack=[], baseRev={}, dirtyBase={};
const $=s=>document.querySelector(s);
const fmt=v=>v===null||v===undefined||v===''||isNaN(v)?'':Math.round(v).toLocaleString('ko-KR');
const won=v=>v===null||v===undefined?'—':fmt(v)+'원';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toNum=s=>{if(s===null||s===undefined)return null;s=String(s).replace(/[,\s원]/g,'');if(s==='')return null;const n=Number(s);return isNaN(n)?NaN:n};
const label=p=>{const[y,m]=p.split('.');return `${y}년 ${+m}월분`};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const nowStr=ms=>new Date(ms).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function ask(msg,yes='확인',onlyOk=false){return new Promise(res=>{$('#modalMsg').textContent=msg;$('#modalYes').textContent=yes;$('#modalNo').hidden=onlyOk;$('#modal').hidden=false;
  const done=v=>{$('#modal').hidden=true;$('#modalYes').onclick=$('#modalNo').onclick=null;res(v)};$('#modalYes').onclick=()=>done(true);$('#modalNo').onclick=()=>done(false);$('#modalYes').focus()})}
const tell=msg=>ask(msg,'확인',true);
function setSync(t){$('#sync').textContent=t}
const META_KEYS=['rev','updatedAt','updatedBy','updatedAtMs'];
function blank(p){p=p||{};const o=Object.assign({meters:[],payments:[],expenses:[],cash:[],arrears:[],opening:null,memo:'',billing:null,closed:null},p);META_KEYS.forEach(k=>delete o[k]);return o}

/* ---------- 날짜 정리: 8/26, 0826, 08월26일, 2026-08-26 → 08월26일 ---------- */
function normDate(s){
  s=String(s||'').trim();if(!s)return '';
  let m=s.match(/^(?:\d{4}[-./])?(\d{1,2})[-./월\s]+(\d{1,2})일?$/)||s.match(/^(\d{2})(\d{2})$/);
  if(m){const mm=+m[1],dd=+m[2];if(mm>=1&&mm<=12&&dd>=1&&dd<=31)return `${String(mm).padStart(2,'0')}월${String(dd).padStart(2,'0')}일`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);if(m)return `${m[2]}월${m[3]}일`;
  return s;
}
const dateKey=s=>{const m=String(s||'').match(/(\d{1,2})\D+(\d{1,2})/);return m?(+m[1])*100+(+m[2]):9999};

/* ---------- 변경 내용 요약 ---------- */
const LISTN={payments:'입금',expenses:'통장 지출',cash:'시재 지출',arrears:'미납'};
const FIELDN={room:'호실',payer:'입금자',date:'날짜',amount:'금액',note:'비고',desc:'내용',name:'이름',charge:'부과액',lateFee:'연체료',ep:'전월 전기',ec:'당월 전기',wp:'이전 수도',wc:'당월 수도',bank:'통장 이월금',interest:'이자',cash:'시재 이월금',total:'총액',method:'배분방식',exclude:'제외 호실'};
const sv=v=>v===null||v===undefined||v===''?'(빈칸)':typeof v==='number'?fmt(v):String(v);
function rowLabel(l,o){return (o.room?`${o.room}호`:(o.desc||o.name||''))+(o.charge!==undefined&&o.amount===undefined?` ${fmt(o.charge)}원`:'')}
function diffPeriod(a,b){
  a=a||{};b=b||{};const out=[];
  if(!a.meters&&b.meters){out.push('새 달 생성');return out}
  if(a.meters&&!b.meters){out.push('달 삭제');return out}
  const am=Object.fromEntries((a.meters||[]).map(r=>[r.room,r]));
  for(const r of b.meters||[]){const o=am[r.room]||{};for(const f of ['name','ep','ec','wp','wc'])if((o[f]??null)!==(r[f]??null))out.push(`검침 ${r.room}호 ${FIELDN[f]}: ${sv(o[f])} → ${sv(r[f])}`)}
  for(const l of Object.keys(LISTN)){
    const A=a[l]||[],B=b[l]||[];
    if(A.length===B.length){B.forEach((r,i)=>{const o=A[i]||{};for(const f of Object.keys(r))if(JSON.stringify(o[f])!==JSON.stringify(r[f]))out.push(`${LISTN[l]} ${i+1}번째 줄(${rowLabel(l,r)}) ${FIELDN[f]||f}: ${sv(o[f])} → ${sv(r[f])}`)})}
    else{const ka=A.map(x=>JSON.stringify(x)),kb=B.map(x=>JSON.stringify(x));
      B.forEach((r,i)=>{if(!ka.includes(kb[i]))out.push(`${LISTN[l]} 추가/수정: ${rowLabel(l,r)} ${r.amount!==undefined?fmt(r.amount)+'원':''}`)});
      A.forEach((r,i)=>{if(!kb.includes(ka[i]))out.push(`${LISTN[l]} 삭제: ${rowLabel(l,r)} ${r.amount!==undefined?fmt(r.amount)+'원':''}`)})}
  }
  if(JSON.stringify(a.opening)!==JSON.stringify(b.opening)){const o=a.opening||{},n=b.opening||{};for(const f of ['bank','interest','cash'])if((o[f]??null)!==(n[f]??null))out.push(`이월금 ${FIELDN[f]}: ${sv(o[f])} → ${sv(n[f])}`)}
  if(JSON.stringify(a.billing)!==JSON.stringify(b.billing)){
    const A=(a.billing||{}).items||[],B=(b.billing||{}).items||[];
    if(A.length!==B.length)out.push(`부과 항목 ${A.length}개 → ${B.length}개`);
    B.forEach((r,i)=>{const o=A[i]||{};for(const f of ['name','total','method','exclude'])if(JSON.stringify(o[f])!==JSON.stringify(r[f]))out.push(`부과 항목 ${i+1}(${r.name||''}) ${FIELDN[f]||f}: ${sv(o[f])} → ${sv(r[f])}`)});
    const aa=(a.billing||{}).adjust||{},ba=(b.billing||{}).adjust||{};

/* ---------- 저장 (Firestore, 충돌 감지) ---------- */
const pending={}, writing={}, timers={};

async function flush(p){

  const opt=typeof pending[p]==='object'?pending[p]:{};
  writing[p]=true;pending[p]=false;
  const data=S.periods[p]?clone(S.periods[p]):null, before=dirtyBase[p], ref=FS.collection('periods').doc(p);

      let vid=null;
      if(snap.exists){const vref=FS.collection('versions').doc();vid=vref.id;const old=snap.data();tx.set(vref,{period:p,rev:remoteRev,atMs:ms,by,data:blank(old)})}
      if(data)tx.set(ref,Object.assign(data,{rev:remoteRev+1,updatedAtMs:ms,updatedBy:by}));else tx.delete(ref);

  }catch(e){
    if(e.code==='conflict'){
      const lost=diffPeriod(before,data);
      if(e.remote){S.periods[p]=blank(clone(e.remote));baseRev[p]=e.remote.rev||0}else{delete S.periods[p];baseRev[p]=0}
      delete dirtyBase[p];pending[p]=false;setSync('다른 기기 내용으로 갱신됨');render();
      tell(`${label(p)}을 다른 기기(또는 다른 창)에서 먼저 고쳐서, 방금 입력한 내용은 저장하지 않고 최신 내용을 불러왔습니다.\n\n저장되지 않은 내용:\n· ${lost.slice(0,8).join('\n· ')||'(없음)'}${lost.length>8?`\n· 외 ${lost.length-8}건`:''}\n\n필요하면 다시 입력해 주세요.`);
    }else if(e.code==='permission-denied'){canWrite=false;pending[p]=false;setSync('권한 없음');tell('이 계정은 저장 권한이 없습니다.');render()}
    else{pending[p]=opt;setSync('저장 실패 — 다시 시도 중 (인터넷 확인)');setTimeout(()=>flush(p),2500+Math.random()*1500)}
  }finally{writing[p]=false}
}

/* ---------- 계산 ---------- */
const periods=()=>Object.keys(S.periods).sort();
const P=p=>S.periods[p||cur];
const prevOf=p=>{const ps=periods(),i=ps.indexOf(p);return i>0?ps[i-1]:null};
const isLatest2=p=>periods().slice(-2).includes(p);

const roomsOf=p=>(P(p).meters||[]).map(r=>r.room);

function usage(prev,cur){

function hasFin(p){const x=P(p);return !!(x.opening||x.payments.length||x.expenses.length||x.cash.length||x.closed)}

  const q=prevOf(p);if(!q)return null;
  const Q=P(q);if(Q.closed)return {bank:Q.closed.bank,interest:0,cash:Q.closed.cash,auto:'closed'};

  const c=closing(q);return c?{bank:c.bank,interest:0,cash:c.cash,auto:'live'}:null;

function closing(p){
  const k='c'+p;if(_memo[k]!==undefined)return _memo[k];
  const x=P(p),o=opening(p);if(!o)return _memo[k]=null;
  const pay=sum(x.payments.map(a=>a.amount)),exp=sum(x.expenses.map(a=>a.amount)),cash=sum(x.cash.map(a=>a.amount));
  const bank=o.bank+(o.interest||0)+pay-exp,cashLeft=o.cash-cash;
  return _memo[k]={pay,exp,cashUsed:cash,bank,cash:cashLeft,total:bank+cashLeft};
}
/* 부과 */
const METHODS={equal:'세대 균등',elec:'전기 사용량 비례',water:'수도 사용량 비례'};
function hasBilling(p){const b=P(p).billing;return !!(b&&((b.items||[]).length||Object.values(b.adjust||{}).some(v=>v)))}
const parseRooms=s=>String(s||'').split(/[^0-9]+/).filter(Boolean);
function billing(p){
  const k='b'+p;if(_memo[k]!==undefined)return _memo[k];
  const x=P(p),b=x.billing;if(!hasBilling(p))return _memo[k]=null;
  const unit=b.unit||10,rooms=roomsOf(p),rows=meterRows(p),eMap=Object.fromEntries(rows.map(r=>[r.room,Math.max(0,r.e.u||0)])),wu=waterUse(p);
  const per=Object.fromEntries(rooms.map(r=>[r,{items:[],adjust:+((b.adjust||{})[r]||0),total:0}]));
  const itemRes=(b.items||[]).map(it=>{
    const ex=new Set(parseRooms(it.exclude)),elig=rooms.filter(r=>!ex.has(r));
    const w=r=>it.method==='elec'?eMap[r]:it.method==='water'?(wu.map[r]||0):1;
    const W=sum(elig.map(w));let alloc=0;
    rooms.forEach(r=>{const v=(!ex.has(r)&&W>0)?Math.round((+it.total||0)*w(r)/W/unit)*unit:0;per[r].items.push(v);alloc+=v});
    return {total:+it.total||0,alloc,diff:alloc-(+it.total||0),W};
  });

  return _memo[k]={per,itemRes,sum:sum(rooms.map(r=>per[r].total)),waterFrom:wu.p,unit};

/* 미납: 부과가 있는 달은 호실별 장부(이월+부과-입금), 없는 달은 미납 목록(납부액은 입금 탭에서 자동) */
const paidBy=(p,room)=>sum(P(p).payments.filter(a=>String(a.room)===String(room)).map(a=>a.amount));
function arrearPaid(p,a){return paidBy(p,a.room)}
function arrearLeft(a,p){return (+a.charge||0)+(+a.lateFee||0)-arrearPaid(p||cur,a)}
function endBalance(q,room){
  if(hasBilling(q)){const L=ledger(q);return L&&L.rows[room]?L.rows[room].end:0}
  return sum(P(q).arrears.filter(a=>String(a.room)===String(room)).map(a=>arrearLeft(a,q)));

function ledger(p){

  const B=billing(p),q=prevOf(p),rows={};
  roomsOf(p).forEach(r=>{const carry=q?endBalance(q,r):0,bill=B.per[r].total,paid=paidBy(p,r);rows[r]={carry,bill,paid,end:carry+bill-paid}});

}
function unpaidTotal(p){
  if(hasBilling(p)){const L=ledger(p);return sum(Object.values(L.rows).map(r=>Math.max(0,r.end)))}

function overpaidTotal(p){if(!hasBilling(p))return 0;return sum(Object.values(ledger(p).rows).map(r=>Math.max(0,-r.end)))}

function checks(p){

  if(x.closed)out.push(['ok',`이 달은 마감했습니다 (${nowStr(x.closed.atMs)}). 통장 ${won(x.closed.bank)}, 현금 ${won(x.closed.cash)}`]);
  const miss=rows.filter(r=>r.ec===null||r.ec===undefined);

  const neg=rows.filter(r=>r.e.neg||r.w.neg);
  if(neg.length)out.push(['err',`사용량이 마이너스로 나온 집: ${neg.map(r=>r.room+'호').join(', ')} — 숫자를 다시 확인하세요.`]);

  if(roll.length)out.push(['info',`계량기가 한 바퀴 돈 집: ${roll.map(r=>`${r.room}호(${fmt(r.e.u)})`).join(', ')} — 자동으로 맞게 계산했습니다.`]);
  // 평소 대비 급증: 최근 6개월 평균의 3배 이상이면서, 작년 같은 달의 2배 이상일 때만 (여름·겨울 계절 증가는 제외)
  const ps=periods(),i=ps.indexOf(p),hist=ps.slice(Math.max(0,i-6),i);
  const hm=hist.map(q=>Object.fromEntries(meterRows(q).map(z=>[z.room,z.e.u])));
  const ly=(+p.slice(0,4)-1)+p.slice(4),lym=S.periods[ly]?Object.fromEntries(meterRows(ly).map(z=>[z.room,z.e.u])):null;
  const spikes=rows.filter(r=>{if(!(r.e.u>0))return false;const h=hm.map(mp=>{const u=mp[r.room];return u>0&&u<3000?u:null}).filter(v=>v!==null);if(h.length<3)return r.e.u>1500;const avg=sum(h)/h.length;const lyv=lym&&lym[r.room]>0&&lym[r.room]<3000?lym[r.room]:null;return r.e.u>Math.max(avg*3,avg+300)&&(lyv===null||r.e.u>lyv*2)});

}

const MONTHN=p=>+p.slice(5);

    main.innerHTML=ready?`<div class="empty">아직 장부 자료가 없습니다.<br><br><button class="btn p" data-act="restore">백업 파일로 자료 넣기</button></div>`:'<div class="empty">장부를 불러오는 중입니다…</div>';

  if(!await ask(`${label(np)}을 새로 만들까요?\n\n· 입주자 이름과 전월 검침값이 이어집니다\n· 통장·시재 잔액은 전월 결산에서 이어집니다\n· 미납은 자동으로 넘어갑니다`,'만들기'))return;
  const L=P(last),odd=(+np.slice(5))%2===1;
  const lastW={};ps.forEach(p=>P(p).meters.forEach(r=>{if(r.wc!==null&&r.wc!==undefined)lastW[r.room]=r.wc}));
  const arrears=hasBilling(last)?[]:L.arrears.filter(a=>arrearLeft(a,last)>0).map(a=>({room:a.room,name:a.name,charge:arrearLeft(a,last),lateFee:0,note:`${label(last)}에서 이월`}));
  S.periods[np]=blank({meters:L.meters.map(r=>({room:r.room,name:r.name,ep:r.ec,ec:null,wp:odd?(lastW[r.room]??null):null,wc:null})),arrears,
    billing:L.billing?{items:(L.billing.items||[]).map(it=>({...it,total:0})),adjust:{},unit:L.billing.unit||10}:null});
  baseRev[np]=0;markDirty(np,null);cur=np;tab='home';render();toast(`${label(np)}을 만들었습니다`);
}
async function saveFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=filename;document.body.appendChild(el);el.click();setTimeout(()=>{el.remove();URL.revokeObjectURL(u)},3000);return true}
  catch(e){tell('파일을 내려받지 못했습니다: '+e.message);return false}
}
async function backup(){
  if(await saveFile(`정연관리비_백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:3,periods:S.periods,exportedAt:new Date().toISOString()}))){await saveMeta({lastBackup:Date.now()});render();toast('백업 파일을 내려받았습니다 (다운로드 폴더)')}
}
async function restore(f){
  let d;try{d=JSON.parse(await f.text());if(!d.periods||typeof d.periods!=='object')throw 0}catch(_){return tell('올바른 백업 파일이 아닙니다.')}
  const ids=Object.keys(d.periods).filter(k=>/^\d{4}\.\d{2}$/.test(k));
  if(!ids.length)return tell('백업 파일에 정산월 자료가 없습니다.');
  if(!await ask(`백업 파일의 ${ids.length}개월 자료로 현재 자료를 바꿀까요?\n(백업에 없는 달은 그대로 둡니다. 바뀌기 전 상태는 변경 기록에 보관됩니다)`,'복원'))return;
  for(const id of ids){const before=S.periods[id]?clone(S.periods[id]):null;S.periods[id]=blank(d.periods[id]);if(!(id in dirtyBase))dirtyBase[id]=before;pending[id]={force:true,reason:'백업 파일에서 복원'};await flush(id)}
  render();toast('복원했습니다');
}
/* ---------- 엑셀 (원본 양식에 가깝게) ---------- */
function needX(){if(typeof XLSX==='undefined'){tell('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.');return false}return true}
function ws(rows,widths,merges){const s=XLSX.utils.aoa_to_sheet(rows);s['!cols']=widths.map(w=>({wch:w}));if(merges)s['!merges']=merges;return s}
const M=(r1,c1,r2,c2)=>({s:{r:r1,c:c1},e:{r:r2,c:c2}});
function exportMonth(){
  if(!cur||!needX())return;
  const x=P(),wb=XLSX.utils.book_new(),y=cur.slice(0,4),m=+cur.slice(5),pm=m===1?12:m-1,mr=meterRows(cur);
  // 검침 (원본: 분류/전기/수도, 층별 소계, 합계)
  const s1=[['정연지오빌1차   전기,수도 검침량'],[`${y}년 ${m}월분`],['분류','','전기','','','수도'],['호수','성명',`${pm}월분`,`${m}월분`,'사용량','이전','당월','사용량']];
  for(const f of ROOMS_FLOORS){const fr=mr.filter(r=>r.room[0]==String(f));fr.forEach(r=>s1.push([+r.room,r.name,r.ep,r.ec,r.e.u,r.wp,r.wc,r.w.u]));s1.push(['소계','',sum(fr.map(r=>r.ep)),sum(fr.map(r=>r.ec)),sum(fr.map(r=>r.e.u)),sum(fr.map(r=>r.wp)),sum(fr.map(r=>r.wc)),sum(fr.map(r=>r.w.u))])}
  s1.push(['합계','',sum(mr.map(r=>r.ep)),sum(mr.map(r=>r.ec)),sum(mr.map(r=>r.e.u)),sum(mr.map(r=>r.wp)),sum(mr.map(r=>r.wc)),sum(mr.map(r=>r.w.u))]);
  XLSX.utils.book_append_sheet(wb,ws(s1,[8,12,10,10,10,10,10,10],[M(0,0,0,7),M(2,2,2,4),M(2,5,2,7)]),`${y}.${String(m).padStart(2,'0')}`);
  if(hasBilling(cur)){const B=billing(cur),its=x.billing.items;
    const s=[[`[정연지오빌1 ${m}월분 관리비 부과내역]`],[],['호실','성명',...its.map(i=>i.name),'개별 조정','부과액'],...roomsOf(cur).map(r=>[+r,(x.meters.find(z=>z.room===r)||{}).name,...B.per[r].items,B.per[r].adjust,B.per[r].total]),['합계','',...B.itemRes.map(i=>i.alloc),sum(Object.values(x.billing.adjust||{})),B.sum],[],['항목','고지서 총액','나누는 방식','제외 호실'],...its.map(i=>[i.name,i.total,METHODS[i.method],i.exclude||''])];
    XLSX.utils.book_append_sheet(wb,ws(s,[8,12,...its.map(()=>12),10,12]),'부과내역')}
  if(finActive(cur)){
    const pays=x.payments.slice().sort((a,b)=>(+a.room||0)-(+b.room||0));
    XLSX.utils.book_append_sheet(wb,ws([[`<정연 지오빌1 ${y}년${m}월분 관리비 입금 내역서>`],['호    실','성    명','입 금 일','입 금 액','비    고'],...pays.map(a=>[a.room,a.payer,a.date,a.amount,a.note]),['','','합    계',sum(x.payments.map(a=>a.amount)),'']],[8,12,12,12,24],[M(0,0,0,4)]),'관리비 입금내역');
    const o=opening(cur),c=closing(cur),mm=String(m).padStart(2,'0'),pmm=String(pm).padStart(2,'0');
    const s3=[[`【 ${y}년도 (${mm}월 달 )  공과금 지출 내역서 】`],['일    자','','지  출  내  용','지  출  금  액','비    고'],...x.expenses.map(a=>[a.date,'',a.desc,a.amount,a.note]),['지 출 총 액','','',c.exp,''],[],['【 전도금 (시재) 지출 내역 】'],['일    자','','지  출  내  용','지  출  금  액','비    고'],[`${pmm} 월달 이월금`,'','',o.cash,''],...x.cash.map(a=>[a.date,'',a.desc,a.amount,a.note]),['지출금액','',c.cashUsed,'지출잔액',c.cash],[],[`【 ${mm}월달 수입 및 지출금 총액 】`],[`   ${pmm} 월달 통장 이월금`,'','',o.bank,''],[`   ${mm}월달 결산 이자`,'','',o.interest||0,''],[`   ${mm} 월 관리비 입금액`,'','',c.pay,''],[`   ${mm} 월 통장 지출금`,'','',c.exp,''],[`   ${mm} 월 시재금 사용 잔액`,'','',c.cash,''],[`   ${mm} 월 통장 잔여금`,'','',c.bank,''],[`${mm}월달 총 합계금 잔액`,'','',c.total,'']];
    XLSX.utils.book_append_sheet(wb,ws(s3,[16,2,24,14,30],[M(0,0,0,4)]),'지출내역');
    let s4;
    if(hasBilling(cur)){const L=ledger(cur);s4=[[`[정연지오빌1 ${mm}월분 관리비 미납현황]`],['호수','입주자 이름','전월 잔액','당월 부과액','당월 입금','미납(과오납) 잔액'],...roomsOf(cur).filter(r=>L.rows[r].end!==0).map(r=>[+r,(x.meters.find(z=>z.room===r)||{}).name,L.rows[r].carry,L.rows[r].bill,L.rows[r].paid,L.rows[r].end]),['합 계','','','','',unpaidTotal(cur)]]}
    else s4=[[`[정연지오빌1 ${mm}월분 관리비 미납현황]`],['호수','입주자 이름','당월 부과액','연체료','이번 달 입금','납기후 금액','비       고'],...x.arrears.map(a=>[+a.room||a.room,a.name,a.charge,a.lateFee,arrearPaid(cur,a),arrearLeft(a,cur),a.note]),['합 계','','','','',unpaidTotal(cur),'']];
    XLSX.utils.book_append_sheet(wb,ws(s4,[8,12,12,12,12,14,24],[M(0,0,0,5)]),'미납현황');
  }
  XLSX.writeFile(wb,`정연지오빌1_관리비_${cur}.xlsx`);toast('엑셀 파일을 내려받았습니다 (다운로드 폴더)');
}
function exportAll(){
  if(!needX())return;
  const ps=periods(),wb=XLSX.utils.book_new(),rooms=P(ps[ps.length-1]).meters.map(r=>r.room),head=['정산월',...rooms.map(r=>r+'호')];
  const E=[head,...ps.map(p=>{const m=meterRows(p);return [label(p),...rooms.map(r=>{const z=m.find(q=>q.room===r);return z?z.e.u:null})]})];
  const Wt=[head,...ps.map(p=>{const m=meterRows(p);if(!m.some(z=>z.w.u!==null))return null;return [label(p),...rooms.map(r=>{const z=m.find(q=>q.room===r);return z?z.w.u:null})]}).filter(Boolean)];
  XLSX.utils.book_append_sheet(wb,ws(E,[14]),'전기 사용량');XLSX.utils.book_append_sheet(wb,ws(Wt,[14]),'수도 사용량');
  XLSX.writeFile(wb,`정연지오빌1_검침이력_${ps[0]}-${ps[ps.length-1]}.xlsx`);toast('엑셀 파일을 내려받았습니다');
}

document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='unlock'){unlocked[cur]=true;render()}
  else if(a==='meter')meterSheet(+t.dataset.i);
  else if(a==='pay')paySheet(+t.dataset.i);
  else if(a==='exp')expSheet(t.dataset.l,+t.dataset.i);
  else if(a==='arr')arrSheet(+t.dataset.i);
  else if(a==='editOpening')openingSheet();
  else if(a==='newMonth')newMonth();
  else if(a==='exportX')exportMonth();
  else if(a==='goto'){cur=t.dataset.p;tab='home';render();window.scrollTo(0,0)}
  else if(a==='bill-start'){change(cur,x=>x.billing={unit:10,adjust:{},items:[{name:'용역비(도급비)',total:0,method:'equal',exclude:''},{name:'공용 전기요금',total:0,method:'equal',exclude:''},{name:'세대 전기요금',total:0,method:'elec',exclude:''},{name:'수도요금',total:0,method:'water',exclude:''}]});render();toast('기본 항목을 넣었습니다. 고지서 금액을 넣어 주세요')}
  else if(a==='bill-copy'){const ps=periods().filter(p=>p<cur&&P(p).billing&&(P(p).billing.items||[]).length).pop();if(!ps)return tell('가져올 지난달 항목이 없습니다.');change(cur,x=>x.billing={unit:P(ps).billing.unit||10,adjust:{},items:P(ps).billing.items.map(it=>({...it,total:0}))});render();toast('지난달 항목을 가져왔습니다. 금액을 넣어 주세요')}
  else if(a==='bill-add'){change(cur,x=>x.billing.items.push({name:'',total:0,method:'equal',exclude:''}));render()}
  else if(a==='bill-del'){if(await ask('이 항목을 지울까요?','지우기')){change(cur,x=>x.billing.items.splice(+t.dataset.i,1));render()}}
  else if(a==='closeMonth'){const c=closing(cur);if(!await ask(`${label(cur)}을 마감할까요?\n\n통장에 남은 돈 ${won(c.bank)}\n현금 남은 돈 ${won(c.cash)}\n\n이 숫자가 다음 달로 넘어가고, 이 달은 잠깁니다.`,'마감하기'))return;
    change(cur,x=>x.closed={atMs:Date.now(),by:USER?USER.email:'',bank:c.bank,cash:c.cash,total:c.total});render();toast('마감했습니다')}
  else if(a==='reopen'){if(!await ask(`${label(cur)} 마감을 풀까요?\n\n풀면 이 달을 다시 고칠 수 있고, 다음 달로 넘어가는 돈도 다시 계산됩니다.`,'마감 풀기'))return;
    change(cur,x=>x.closed=null);unlocked[cur]=true;render();toast('마감을 풀었습니다')}
  else if(a==='revert'){
    const p=t.dataset.p;if(!await ask(`${label(p)}을 이렇게 고치기 바로 전 상태로 되돌릴까요?\n(지금 상태도 기록에 남아서 다시 되돌릴 수 있습니다)`,'되돌리기'))return;
    try{const v=await FS.collection('versions').doc(t.dataset.v).get();if(!v.exists)return tell('예전 상태를 찾지 못했습니다.');
      const before=S.periods[p]?clone(S.periods[p]):null;S.periods[p]=blank(v.data().data);markDirty(p,before,{reason:`고친 기록에서 되돌림 (${nowStr(v.data().atMs)} 전 상태)`});cur=p;tab='home';render();toast('되돌렸습니다')}
    catch(err){tell('되돌리지 못했습니다: '+(err.code||err.message))}}
  else if(a==='backup')backup();
  else if(a==='restore')$('#restoreFile').click();
  else if(a==='exportAll')exportAll();
  else if(a==='logout')$('#logout').click();
  else if(a==='undo')doUndo();
});
document.addEventListener('change',e=>{
  if(e.target.id==='histRoom'){histRoom=e.target.value;render()}
  if(e.target.id==='logOnlyCur'){VIEWS._logCur=e.target.checked;loadLogs()}
  if(e.target.id==='memo'){const v=e.target.value;change(cur,x=>x.memo=v);toast('메모를 저장했습니다')}
  if(e.target.id==='restoreFile'){const f=e.target.files[0];e.target.value='';if(f)restore(f)}
});
$('#mPrev').onclick=()=>{const ps=periods(),i=ps.indexOf(cur);if(i>0){cur=ps[i-1];render()}};
$('#mNext').onclick=()=>{const ps=periods(),i=ps.indexOf(cur);if(i<ps.length-1){cur=ps[i+1];render()}};
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function doUndo(){
  const u=undoStack.pop();if(!u)return toast('이번에 들어와서 고친 것이 없습니다');
  const before=S.periods[u.p]?clone(S.periods[u.p]):null;
  if(u.doc)S.periods[u.p]=u.doc; else delete S.periods[u.p];
  if(!(u.p in dirtyBase))dirtyBase[u.p]=before;pending[u.p]={reason:'되돌리기'};clearTimeout(timers[u.p]);timers[u.p]=setTimeout(()=>flush(u.p),50);render();toast('방금 고친 것을 되돌렸습니다');
}
boot();
</script>
